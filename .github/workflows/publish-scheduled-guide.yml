name: Publish scheduled guide

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-scheduled-guide
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Select and validate one ready article
        id: select
        run: |
          slug="$(python publish_next.py)"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: Install image generator dependency
        if: steps.select.outputs.slug != ''
        run: python -m pip install Pillow

      - name: Generate sharing image
        if: steps.select.outputs.slug != ''
        run: python gen_missing_og.py

      - name: Build and validate site
        if: steps.select.outputs.slug != ''
        run: |
          python build_site.py
          python validate_build.py

      - name: Commit and push publication
        if: steps.select.outputs.slug != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md content_queue pages site
          if git diff --cached --quiet; then
            echo "No publication changes to commit"
            exit 0
          fi
          git commit -m "Publish scheduled guide: ${{ steps.select.outputs.slug }}"
          git pull --rebase origin main
          python build_site.py
          python validate_build.py
          git push origin main
